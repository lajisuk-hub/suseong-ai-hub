<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10163A"/>
      <stop offset="0.5" stop-color="#1C2456"/>
      <stop offset="1" stop-color="#2E2A6E"/>
    </linearGradient>
    <radialGradient id="orbCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3ED6E0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#3ED6E0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B6FE8" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#8B6FE8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orbPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#E86FA8" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#E86FA8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nodeGlow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#9FD8FF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#9FD8FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ED6E0" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#6FB6FF" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#8B6FE8" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots2" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#FFFFFF" opacity="0.10"/>
    </pattern>
  </defs>

  <rect width="1600" height="900" fill="url(#bg2)"/>
  <rect width="1600" height="900" fill="url(#dots2)"/>

  <!-- 은은한 빛 덩어리 -->
  <circle cx="220" cy="760" r="420" fill="url(#orbCyan)"/>
  <circle cx="1420" cy="160" r="460" fill="url(#orbViolet)"/>
  <circle cx="900" cy="880" r="330" fill="url(#orbPink)"/>

  <!-- 흐르는 곡선 -->
  <g fill="none">
    <path d="M-50 640 C 350 520 700 720 1050 600 S 1500 480 1680 540" stroke="url(#sweep)" stroke-width="2.5"/>
    <path d="M-50 700 C 380 590 720 780 1080 660 S 1520 540 1680 600" stroke="url(#sweep)" stroke-width="1.5" opacity="0.6"/>
  </g>

  <!-- 오른쪽 궤도 링 -->
  <g transform="translate(1180,430)">
    <circle cx="0" cy="0" r="150" fill="none" stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="220" fill="none" stroke="#FFFFFF" stroke-opacity="0.10" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="295" fill="none" stroke="#FFFFFF" stroke-opacity="0.06" stroke-width="1"/>

    <!-- 중심 AI 칩 -->
    <g>
      <circle cx="0" cy="0" r="86" fill="url(#nodeGlow2)" opacity="0.55"/>
      <rect x="-40" y="-40" width="80" height="80" rx="18" fill="none" stroke="#CFE4FF" stroke-width="2.5"/>
      <rect x="-22" y="-22" width="44" height="44" rx="10" fill="none" stroke="#9FD8FF" stroke-width="2"/>
      <g stroke="#CFE4FF" stroke-width="2.5" stroke-linecap="round">
        <path d="M-14 -40 v -18 M 0 -40 v -18 M 14 -40 v -18"/>
        <path d="M-14 40 v 18 M 0 40 v 18 M 14 40 v 18"/>
        <path d="M-40 -14 h -18 M -40 0 h -18 M -40 14 h -18"/>
        <path d="M40 -14 h 18 M 40 0 h 18 M 40 14 h 18"/>
      </g>
      <text x="0" y="9" text-anchor="middle" font-size="30" font-weight="700" fill="#EAF4FF" font-family="Pretendard, sans-serif" letter-spacing="2">AI</text>
    </g>

    <!-- 궤도 위 점들 -->
    <g>
      <circle cx="-150" cy="0" r="34" fill="url(#nodeGlow2)" opacity="0.8"/>
      <circle cx="-150" cy="0" r="5" fill="#FFFFFF"/>
      <circle cx="106" cy="-106" r="30" fill="url(#nodeGlow2)" opacity="0.7"/>
      <circle cx="106" cy="-106" r="4.5" fill="#FFFFFF"/>
      <circle cx="156" cy="156" r="26" fill="url(#nodeGlow2)" opacity="0.6"/>
      <circle cx="156" cy="156" r="4" fill="#FFFFFF"/>
      <circle cx="-208" cy="-208" r="4" fill="#FFFFFF" opacity="0.8"/>
      <circle cx="0" cy="295" r="3.5" fill="#FFFFFF" opacity="0.6"/>
      <circle cx="295" cy="0" r="3.5" fill="#FFFFFF" opacity="0.6"/>
    </g>
  </g>

  <!-- 왼쪽 아래 가는 선 아이콘: 열린 책 + 전구 (배움과 아이디어) -->
  <g transform="translate(240,640)" stroke="#BFD8FF" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85">
    <path d="M0 0 q -30 -20 -58 -8 l 0 64 q 28 -12 58 8 q 30 -20 58 -8 l 0 -64 q -28 -12 -58 8 Z"/>
    <path d="M0 0 L 0 64"/>
  </g>
  <g transform="translate(392,590)" stroke="#BFD8FF" stroke-width="2.2" fill="none" stroke-linecap="round" opacity="0.85">
    <circle cx="0" cy="0" r="20"/>
    <path d="M-9 26 L 9 26 M -6 36 L 6 36"/>
    <path d="M0 -36 L 0 -28 M 26 -26 L 21 -21 M -26 -26 L -21 -21 M 36 0 L 28 0 M -36 0 L -28 0"/>
  </g>

  <!-- 반짝임 -->
  <g fill="#FFFFFF">
    <path d="M320 200 l 5 14 l 14 5 l -14 5 l -5 14 l -5 -14 l -14 -5 l 14 -5 Z" opacity="0.9"/>
    <path d="M700 300 l 4 10 l 10 4 l -10 4 l -4 10 l -4 -10 l -10 -4 l 10 -4 Z" opacity="0.6"/>
    <path d="M560 130 l 3 8 l 8 3 l -8 3 l -3 8 l -3 -8 l -8 -3 l 8 -3 Z" opacity="0.5"/>
    <circle cx="140" cy="320" r="3" opacity="0.7"/>
    <circle cx="860" cy="180" r="2.5" opacity="0.5"/>
    <circle cx="620" cy="500" r="2.5" opacity="0.45"/>
    <circle cx="1020" cy="720" r="3" opacity="0.5"/>
  </g>
</svg>
