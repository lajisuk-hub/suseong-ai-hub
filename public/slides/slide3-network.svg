<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice" font-family="'Pretendard Variable', Pretendard, 'Malgun Gothic', sans-serif">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="0.7" y2="1">
      <stop offset="0" stop-color="#F7FAFF"/>
      <stop offset="0.55" stop-color="#EAF1FF"/>
      <stop offset="1" stop-color="#DCE8FF"/>
    </linearGradient>
    <linearGradient id="wave3a" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#6D8DF0"/>
      <stop offset="0.6" stop-color="#7FB5FF"/>
      <stop offset="1" stop-color="#5AD1C8"/>
    </linearGradient>
    <radialGradient id="glow3" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#BFD4FF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#BFD4FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="aiText3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F6EF7"/>
      <stop offset="1" stop-color="#7C5CF0"/>
    </linearGradient>
    <filter id="soft3" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#3E5BC7" flood-opacity="0.16"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#bg3)"/>

  <!-- 점 연결 장식 -->
  <g stroke="#9DB6F5" stroke-width="3" fill="none" opacity="0.7">
    <path d="M1000 120 Q 1180 50 1360 110 T 1580 100"/>
    <path d="M80 180 Q 240 110 400 160"/>
  </g>
  <g fill="#7C9BF0" opacity="0.85">
    <circle cx="1000" cy="120" r="8"/>
    <circle cx="1360" cy="110" r="10"/>
    <circle cx="80" cy="180" r="7"/>
    <circle cx="400" cy="160" r="8"/>
  </g>
  <circle cx="1500" cy="640" r="160" fill="#C9DBFF" opacity="0.4"/>
  <circle cx="120" cy="620" r="130" fill="#CFE6FF" opacity="0.5"/>

  <!-- 반짝이 -->
  <g>
    <path d="M700 160 l 6 15 l 15 6 l -15 6 l -6 15 l -6 -15 l -15 -6 l 15 -6 Z" fill="#FFC46B"/>
    <path d="M1230 300 l 5 12 l 12 5 l -12 5 l -5 12 l -5 -12 l -12 -5 l 12 -5 Z" fill="#7EDCD6"/>
    <path d="M350 340 l 4 11 l 11 4 l -11 4 l -4 11 l -4 -11 l -11 -4 l 11 -4 Z" fill="#B9A8FF"/>
  </g>

  <!-- 중앙 허브 -->
  <g transform="translate(800,330)">
    <circle cx="0" cy="0" r="210" fill="url(#glow3)"/>
    <circle cx="0" cy="0" r="130" fill="none" stroke="#A8C0F8" stroke-width="2.5" stroke-dasharray="4 12"/>
    <circle cx="0" cy="0" r="84" fill="#FFFFFF" filter="url(#soft3)"/>
    <text x="0" y="-2" text-anchor="middle" font-size="46" font-weight="800" fill="url(#aiText3)">AI</text>
    <text x="0" y="36" text-anchor="middle" font-size="24" font-weight="700" fill="#3D4C7E">선도기관</text>
  </g>

  <!-- 허브-기관 연결선 -->
  <g stroke="#8FA8F5" stroke-width="3" fill="none" opacity="0.75" stroke-dasharray="1 12" stroke-linecap="round">
    <path d="M800 420 Q 780 520 760 570"/>
    <path d="M735 380 Q 500 480 400 540"/>
    <path d="M865 380 Q 1100 480 1200 540"/>
    <path d="M700 350 Q 350 380 190 480"/>
    <path d="M900 350 Q 1250 380 1410 480"/>
  </g>

  <!-- 기관 노드 (집 모양) -->
  <g>
    <g transform="translate(190,540)">
      <circle cx="0" cy="0" r="64" fill="#FFFFFF" filter="url(#soft3)"/>
      <g stroke="#4F6EF7" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-26 -2 L 0 -26 L 26 -2"/>
        <path d="M-18 -6 v 26 h 36 v -26"/>
        <rect x="-6" y="6" width="12" height="14"/>
      </g>
    </g>
    <g transform="translate(400,600)">
      <circle cx="0" cy="0" r="64" fill="#FFFFFF" filter="url(#soft3)"/>
      <g stroke="#5AA7E8" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-26 -2 L 0 -26 L 26 -2"/>
        <path d="M-18 -6 v 26 h 36 v -26"/>
        <rect x="-6" y="6" width="12" height="14"/>
      </g>
    </g>
    <g transform="translate(760,640)">
      <circle cx="0" cy="0" r="70" fill="#FFFFFF" filter="url(#soft3)"/>
      <g stroke="#7C5CF0" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-28 -2 L 0 -28 L 28 -2"/>
        <path d="M-20 -6 v 28 h 40 v -28"/>
        <rect x="-7" y="7" width="14" height="15"/>
      </g>
    </g>
    <g transform="translate(1200,600)">
      <circle cx="0" cy="0" r="64" fill="#FFFFFF" filter="url(#soft3)"/>
      <g stroke="#48B8A8" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-26 -2 L 0 -26 L 26 -2"/>
        <path d="M-18 -6 v 26 h 36 v -26"/>
        <rect x="-6" y="6" width="12" height="14"/>
      </g>
    </g>
    <g transform="translate(1410,540)">
      <circle cx="0" cy="0" r="64" fill="#FFFFFF" filter="url(#soft3)"/>
      <g stroke="#E8829B" stroke-width="4.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M-26 -2 L 0 -26 L 26 -2"/>
        <path d="M-18 -6 v 26 h 36 v -26"/>
        <rect x="-6" y="6" width="12" height="14"/>
      </g>
    </g>
  </g>

  <!-- 아래 물결 -->
  <path d="M0 780 Q 260 720 520 760 T 1040 750 T 1600 730 L 1600 900 L 0 900 Z" fill="#8FA8F5" opacity="0.35"/>
  <path d="M0 830 Q 300 770 620 810 T 1180 800 T 1600 780 L 1600 900 L 0 900 Z" fill="url(#wave3a)" opacity="0.85"/>
</svg>
