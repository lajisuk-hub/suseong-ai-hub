<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF9EC"/>
      <stop offset="0.45" stop-color="#FFE3B8"/>
      <stop offset="1" stop-color="#FFB98E"/>
    </linearGradient>
    <radialGradient id="sunGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFF3C4" stop-opacity="0.95"/>
      <stop offset="0.55" stop-color="#FFDE8A" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFDE8A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B8E2C0"/>
      <stop offset="1" stop-color="#93CFA4"/>
    </linearGradient>
    <linearGradient id="hillMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FCE9F"/>
      <stop offset="1" stop-color="#6BBB84"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FBE87"/>
      <stop offset="1" stop-color="#4EA96C"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- 해 -->
  <circle cx="800" cy="410" r="300" fill="url(#sunGlow)"/>
  <circle cx="800" cy="410" r="112" fill="#FFE9A0"/>
  <circle cx="800" cy="410" r="92" fill="#FFF3C9"/>

  <!-- 구름 -->
  <g fill="#FFFFFF" opacity="0.9">
    <g>
      <ellipse cx="300" cy="220" rx="110" ry="42"/>
      <ellipse cx="380" cy="200" rx="80" ry="36"/>
      <ellipse cx="230" cy="200" rx="70" ry="30"/>
    </g>
    <g opacity="0.8">
      <ellipse cx="1280" cy="160" rx="130" ry="46"/>
      <ellipse cx="1370" cy="140" rx="86" ry="36"/>
      <ellipse cx="1200" cy="140" rx="76" ry="32"/>
    </g>
    <g opacity="0.7">
      <ellipse cx="1080" cy="330" rx="90" ry="32"/>
      <ellipse cx="1145" cy="315" rx="60" ry="26"/>
    </g>
  </g>

  <!-- 새 -->
  <g stroke="#7A6A55" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.75">
    <path d="M520 250 q 22 -22 44 0 q 22 -22 44 0"/>
    <path d="M640 300 q 18 -18 36 0 q 18 -18 36 0"/>
    <path d="M980 240 q 20 -20 40 0 q 20 -20 40 0"/>
  </g>

  <!-- 언덕 3겹 -->
  <path d="M0 640 Q 300 520 640 620 T 1600 600 L 1600 900 L 0 900 Z" fill="url(#hillBack)"/>
  <path d="M0 720 Q 420 580 860 700 T 1600 690 L 1600 900 L 0 900 Z" fill="url(#hillMid)"/>
  <path d="M0 810 Q 500 700 1000 800 T 1600 780 L 1600 900 L 0 900 Z" fill="url(#hillFront)"/>

  <!-- 나무들 -->
  <g>
    <g transform="translate(250,620)">
      <rect x="-8" y="0" width="16" height="46" rx="7" fill="#8B6B4A"/>
      <circle cx="0" cy="-30" r="46" fill="#5CA877"/>
      <circle cx="-30" cy="-8" r="30" fill="#6DB588"/>
      <circle cx="30" cy="-8" r="30" fill="#6DB588"/>
    </g>
    <g transform="translate(1380,650)">
      <rect x="-9" y="0" width="18" height="52" rx="8" fill="#8B6B4A"/>
      <circle cx="0" cy="-36" r="52" fill="#57A272"/>
      <circle cx="-34" cy="-10" r="34" fill="#68B083"/>
      <circle cx="34" cy="-10" r="34" fill="#68B083"/>
    </g>
    <g transform="translate(1180,700)">
      <rect x="-7" y="0" width="14" height="38" rx="6" fill="#8B6B4A"/>
      <circle cx="0" cy="-26" r="38" fill="#63AE7E"/>
    </g>
  </g>

  <!-- 작은 집 (어린이집) -->
  <g transform="translate(430,690)">
    <rect x="-70" y="-10" width="140" height="86" rx="10" fill="#FFF6E8"/>
    <path d="M-86 -6 L 0 -74 L 86 -6 Z" fill="#F08A5D"/>
    <rect x="-20" y="26" width="40" height="50" rx="6" fill="#C98850"/>
    <rect x="-56" y="10" width="30" height="28" rx="5" fill="#BEE3F8"/>
    <rect x="26" y="10" width="30" height="28" rx="5" fill="#BEE3F8"/>
    <circle cx="0" cy="-28" r="13" fill="#FFF3C9"/>
  </g>

  <!-- 꽃 -->
  <g>
    <g transform="translate(700,830)">
      <circle cx="0" cy="0" r="9" fill="#FFD166"/>
      <g fill="#FF8FAB">
        <circle cx="0" cy="-14" r="8"/><circle cx="13" cy="-4" r="8"/><circle cx="8" cy="12" r="8"/><circle cx="-8" cy="12" r="8"/><circle cx="-13" cy="-4" r="8"/>
      </g>
    </g>
    <g transform="translate(980,850)">
      <circle cx="0" cy="0" r="8" fill="#FFD166"/>
      <g fill="#B8A9F5">
        <circle cx="0" cy="-12" r="7"/><circle cx="11" cy="-4" r="7"/><circle cx="7" cy="10" r="7"/><circle cx="-7" cy="10" r="7"/><circle cx="-11" cy="-4" r="7"/>
      </g>
    </g>
    <g transform="translate(150,840)">
      <circle cx="0" cy="0" r="8" fill="#FFD166"/>
      <g fill="#FF9F68">
        <circle cx="0" cy="-12" r="7"/><circle cx="11" cy="-4" r="7"/><circle cx="7" cy="10" r="7"/><circle cx="-7" cy="10" r="7"/><circle cx="-11" cy="-4" r="7"/>
      </g>
    </g>
  </g>
</svg>
