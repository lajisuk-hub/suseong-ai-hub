<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BDE8FF"/>
      <stop offset="0.6" stop-color="#8ED3FB"/>
      <stop offset="1" stop-color="#6FC0F2"/>
    </linearGradient>
    <linearGradient id="bRed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FF9AA8"/><stop offset="1" stop-color="#F4636F"/>
    </linearGradient>
    <linearGradient id="bYellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE59A"/><stop offset="1" stop-color="#F7B733"/>
